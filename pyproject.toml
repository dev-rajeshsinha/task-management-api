[project]
name = "task-management-api"
version = "0.1.0"
description = "A hands-on project to master FastAPI through building a complete task management system from scratch."
readme = "README.md"
authors = [
    { name = "Rajesh Sinha", email = "rajeshsinha97@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
task-management-api = "task_management_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
